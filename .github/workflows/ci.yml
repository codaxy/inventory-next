name: CI

# Pull requests only, as heavily as they are ready (docs/engineering/testing.md): a draft gets the fast
# checks, a pull request ready for review the integration tests and coverage besides. `main` and
# `production` are checked by the pre-merge check, before shipping pushes them.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push supersedes the run still going for the same pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The server build would otherwise install the pre-commit hook into the runner's checkout.
env:
  HUSKY: 0

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check server

      - name: Build
        run: dotnet build server/Codaxy.Inventory.slnx --configuration Release

      - name: Unit tests
        run: dotnet test server/Codaxy.Inventory.Tests.Unit --configuration Release --no-build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  integration:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build server/Codaxy.Inventory.slnx --configuration Release

      # The tests that serve the shell fall back to wwwroot's index.html: the built one here, as the
      # image has it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the client into wwwroot
        working-directory: client
        run: |
          npm ci
          npm run build
          cp -r dist/. ../server/Codaxy.Inventory.Web/wwwroot/

      # The integration tests start PostgreSQL through Testcontainers, so the runner's Docker is what
      # makes them possible; there is no service container to keep in step with the fixture. The
      # script is the one the pre-merge check runs, so the two cannot disagree.
      - name: Test with the coverage threshold
        run: scripts/coverage.sh --no-build
