name: CI

on:
  push:
  pull_request:

# The server build would otherwise install the pre-commit hook into the runner's checkout.
env:
  HUSKY: 0

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check server

      - name: Build
        run: dotnet build server/Codaxy.Inventory.slnx --configuration Release

      # The integration tests start PostgreSQL through Testcontainers, so the runner's Docker is what
      # makes them possible; there is no service container to keep in step with the fixture.
      - name: Test with coverage
        run: >
          dotnet test server/Codaxy.Inventory.slnx --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory coverage
          --settings server/coverlet.runsettings

      - name: Enforce the coverage threshold
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:'coverage/**/coverage.cobertura.xml' \
            -targetdir:coverage/report -reporttypes:TextSummary
          cat coverage/report/Summary.txt
          line=$(grep -m1 'Line coverage:' coverage/report/Summary.txt | grep -oE '[0-9]+(\.[0-9]+)?')
          echo "Line coverage: $line%"
          awk -v c="$line" 'BEGIN { exit (c + 0 >= 80) ? 0 : 1 }' \
            || { echo "Line coverage $line% is below the 80% the engineering notes require."; exit 1; }

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  # The image, published only once the server and the client have passed: a push to `main` is
  # `:latest`, to `production` `:stable`, and every one also carries its commit's sha to roll back to.
  # Only from Codaxy's repository: a fork or a copy elsewhere cannot push to Codaxy's registry.
  publish:
    needs: [server, client]
    if: >-
      github.repository_owner == 'codaxy' && github.event_name == 'push'
      && (github.ref_name == 'main' || github.ref_name == 'production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/codaxy/inventory-next:${{ github.ref_name == 'production' && 'stable' || 'latest' }}
            ghcr.io/codaxy/inventory-next:${{ github.sha }}
