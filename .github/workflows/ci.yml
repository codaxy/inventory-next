name: CI

# Three gates, each as heavy as what it guards (docs/engineering/testing.md):
# - a pull request: the fast checks on every push; the server's tests too once it is ready for review;
# - production: the tests before `:stable` is published — what runs is never built from a red commit;
# - main: nothing — merges into it went through a pull request's checks or the pre-merge check.
on:
  push:
    branches: [main, production]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A pull request's newer push cancels its older run: ten quick follow-ups cost about one run. A push to
# main or production is a group of its own, so none is cancelled or replaced while queued: each
# publishes its own image.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The server build would otherwise install the pre-commit hook into the runner's checkout.
env:
  HUSKY: 0

jobs:
  # Every push to a pull request, draft or not: what fails fast and costs little. The formatting
  # belongs here — it is about the change, not the application — and nowhere later.
  fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check server
          cd client && npm ci && npm run format:check

      - name: Build the server
        run: dotnet build server/Codaxy.Inventory.slnx --configuration Release

      - name: Unit tests
        run: >-
          dotnet test server/Codaxy.Inventory.Tests.Unit --configuration Release --no-build

      - name: Type-check and build the client
        working-directory: client
        run: |
          npm run typecheck
          npm run build

  # The server's tests with the coverage threshold: a pull request once it is ready for review — a
  # draft iterates on the fast checks alone — and only when it touches the server; and a push to
  # production. The slow part, a few minutes of Testcontainers.
  tests:
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)
      || github.ref_name == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # As the pre-merge check decides: a pull request that leaves server/ alone cannot move the
      # figure. Production always runs them.
      - name: Does it touch the server?
        id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ] \
            && git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- server/; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "server/ untouched: tests skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.scope.outputs.run == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: dotnet build server/Codaxy.Inventory.slnx --configuration Release

      # The tests that serve the shell fall back to wwwroot's index.html: the built one here, as the
      # image has it.
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the client into wwwroot
        if: steps.scope.outputs.run == 'true'
        working-directory: client
        run: |
          npm ci
          npm run build
          cp -r dist/. ../server/Codaxy.Inventory.Web/wwwroot/

      # The integration tests start PostgreSQL through Testcontainers, so the runner's Docker is what
      # makes them possible; there is no service container to keep in step with the fixture. The
      # script is the one the pre-merge check runs, so the two cannot disagree.
      - name: Test with the coverage threshold
        if: steps.scope.outputs.run == 'true'
        run: scripts/coverage.sh --no-build

  # Before :stable, the client must still type-check and build; its formatting no longer matters.
  client:
    if: github.ref_name == 'production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # The image: a push to `main` is `:latest`, at once; to `production` `:stable`, once the tests and
  # the client have passed. Every one also carries its commit's sha to roll back to. On main the jobs
  # it needs are skipped, which `!failure() && !cancelled()` lets through where a bare `needs` would
  # skip this too. Only from Codaxy's repository: a fork or a copy elsewhere cannot push to Codaxy's
  # registry.
  publish:
    needs: [tests, client]
    if: >-
      !failure() && !cancelled()
      && github.repository_owner == 'codaxy' && github.event_name == 'push'
      && (github.ref_name == 'main' || github.ref_name == 'production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # From the commit's own UTC time, so main and production build one commit as one version:
      # year . month . day, without leading zeros — SemVer refuses them — then, as build metadata,
      # the hour and minute and the short sha, which SemVer does not order but a reader does.
      - id: version
        run: |
          stamp=$(TZ=UTC git log -1 --format=%cd --date=format-local:%y.%-m.%-d+%H%M)
          echo "version=$stamp.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image's browser prints before the image is published: a browser that installs and does
      # not run passes every other check, since the tests print with the runner's own Chrome.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: inventory-next:check

      - name: Check that the image's browser prints
        run: >-
          docker run --rm --entrypoint /opt/chrome/chrome inventory-next:check
          --no-sandbox --disable-dev-shm-usage --print-to-pdf=/tmp/check.pdf
          "data:text/html,<p>Mjesto: Banja Luka</p>"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/codaxy/inventory-next:${{ github.ref_name == 'production' && 'stable' || 'latest' }}
            ghcr.io/codaxy/inventory-next:${{ github.sha }}
