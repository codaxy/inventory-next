name: CI

on:
  push:
  pull_request:

# The server build would otherwise install the pre-commit hook into the runner's checkout.
env:
  HUSKY: 0

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check server

      - name: Build
        run: dotnet build server/Codaxy.Inventory.slnx --configuration Release

      # The tests that serve the shell fall back to wwwroot's index.html: the built one here, as the
      # image has it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the client into wwwroot
        working-directory: client
        run: |
          npm ci
          npm run build
          cp -r dist/. ../server/Codaxy.Inventory.Web/wwwroot/

      # The integration tests start PostgreSQL through Testcontainers, so the runner's Docker is what
      # makes them possible; there is no service container to keep in step with the fixture. The
      # script is the one the pre-merge check runs, so the two cannot disagree.
      - name: Test with the coverage threshold
        run: scripts/coverage.sh --no-build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  # The image, published only once the server and the client have passed: a push to `main` is
  # `:latest`, to `production` `:stable`, and every one also carries its commit's sha to roll back to.
  # Only from Codaxy's repository: a fork or a copy elsewhere cannot push to Codaxy's registry.
  publish:
    needs: [server, client]
    if: >-
      github.repository_owner == 'codaxy' && github.event_name == 'push'
      && (github.ref_name == 'main' || github.ref_name == 'production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # From the commit's own UTC time, so main and production build one commit as one version:
      # year . month . day, without leading zeros — SemVer refuses them — then, as build metadata,
      # the hour and minute and the short sha, which SemVer does not order but a reader does.
      - id: version
        run: |
          stamp=$(TZ=UTC git log -1 --format=%cd --date=format-local:%y.%-m.%-d+%H%M)
          echo "version=$stamp.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image's browser prints before the image is published: a browser that installs and does
      # not run passes every other check, since the tests print with the runner's own Chrome.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: inventory-next:check

      - name: Check that the image's browser prints
        run: >-
          docker run --rm --entrypoint /opt/chrome/chrome inventory-next:check
          --no-sandbox --disable-dev-shm-usage --print-to-pdf=/tmp/check.pdf
          "data:text/html,<p>Mjesto: Banja Luka</p>"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/codaxy/inventory-next:${{ github.ref_name == 'production' && 'stable' || 'latest' }}
            ghcr.io/codaxy/inventory-next:${{ github.sha }}
