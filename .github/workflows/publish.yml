name: Publish

# The image, unchecked: a push to `main` is `:latest`, to `production` `:stable`, and every one also
# carries its commit's sha to roll back to. The checks come before (docs/engineering/testing.md).
on:
  push:
    branches: [main, production]

# A push delivered twice runs once, then again behind the first, finding its image to tag.
concurrency:
  group: publish-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Only from Codaxy's repository: a fork or a copy elsewhere cannot push to Codaxy's registry.
  publish:
    if: github.repository_owner == 'codaxy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      IMAGE: ghcr.io/codaxy/inventory-next
      TAG: ${{ github.ref_name == 'production' && 'stable' || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      # From the commit's own UTC time, so main and production build one commit as one version:
      # year . month . day, without leading zeros — SemVer refuses them — then, as build metadata,
      # the hour and minute and the short sha, which SemVer does not order but a reader does.
      - id: version
        run: |
          stamp=$(TZ=UTC git log -1 --format=%cd --date=format-local:%y.%-m.%-d+%H%M)
          echo "version=$stamp.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Shipping to production pushes `main` and `production` at once: the commit's `main` run builds
      # it, and this one waits for that run to tag its image instead of building it again.
      - if: github.ref_name == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish.yml --branch main \
            --commit "$GITHUB_SHA" --json databaseId,status \
            --jq '.[] | select(.status != "completed") | .databaseId')
          for run in $runs; do
            gh run watch "$run" --repo "$GITHUB_REPOSITORY" > /dev/null || true
          done

      # A commit already published under its sha — `main`'s image, when `production` follows it — is
      # tagged, not rebuilt: production runs the very image `:latest` ran.
      - id: existing
        run: |
          if docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # The manifest copied as it is, so the tag names the same digest; `imagetools create` would wrap
      # it in a new one. Skopeo comes with the runner and reads the login above.
      - if: steps.existing.outputs.found == 'true'
        run: skopeo copy --all --preserve-digests "docker://$IMAGE:$GITHUB_SHA" "docker://$IMAGE:$TAG"

      - if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
